name: Build Firmware

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Install ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '10.3-2021.10'

      - name: Build firmware
        run: make all

      - name: Show binary size
        run: arm-none-eabi-size build/T-962-controller.axf

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: T-962-controller
          path: build/T-962-controller.hex

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run native unit tests
        run: make -C tests

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Run cppcheck
        run: |
          cppcheck --enable=warning --inline-suppr --error-exitcode=1 --quiet \
            --suppress=missingIncludeSystem --suppress=unusedFunction \
            --suppress=shiftTooManyBitsSigned --suppress=invalidPrintfArgType_uint \
            --suppress=uninitvar:src/lcd.c \
            -I src src/*.c

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Install ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '10.3-2021.10'

      - name: Build firmware
        run: make all

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/T-962-controller.hex
